name: spike-29

# Feasibility spike for issue #29. Scratch: there is no schedule and no trigger on main.
# It runs on pushes to its own branch and by hand. Delete it with the rest of spike/.

on:
  push:
    branches: [issue-30-actions-spike]
    paths-ignore: ['spike/generated/**']
  workflow_dispatch:

permissions:
  contents: write

env:
  HF_HOME: /home/runner/hfcache
  HF_HUB_DISABLE_PROGRESS_BARS: '1'
  CACHE_KEY: spike29-v1-ubuntu-py312

jobs:

  # ---------------------------------------------------------------- cold: nothing cached
  cold:
    runs-on: ubuntu-latest
    steps:
      - name: disk and memory before anything
        run: |
          df -BM / | tail -1
          free -m
          nproc
          ( while true; do free -m | awk '/^Mem:/{print $3}'; sleep 1; done ) > /tmp/mem.log &
          echo $! > /tmp/mem.pid

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip install cpu torch
        run: |
          t0=$(date +%s.%N)
          python -m pip install --disable-pip-version-check -q \
            --index-url https://download.pytorch.org/whl/cpu torch
          t1=$(date +%s.%N)
          python -m pip install --disable-pip-version-check -q \
            huggingface_hub safetensors tokenizers
          t2=$(date +%s.%N)
          echo "torch_wheel_s=$(echo "$t1 - $t0" | bc)" >> $GITHUB_ENV
          echo "other_wheels_s=$(echo "$t2 - $t1" | bc)" >> $GITHUB_ENV
          echo "torch wheel   $(echo "$t1 - $t0" | bc) s"
          echo "other wheels  $(echo "$t2 - $t1" | bc) s"
          du -sm $(python -c "import site;print(site.getsitepackages()[0])") || true
          du -sm ~/.cache/pip || true
          df -BM / | tail -1

      - name: roll a generation
        run: |
          mkdir -p spike/generated
          SPIKE_THREADS=1 SPIKE_LABEL=cold python spike/roll_spike.py \
            --agents 8 --lines 24 --passes 2 \
            --out spike/generated/cold.json --lines-out spike/generated/lines.txt

      - name: what it cost
        run: |
          kill $(cat /tmp/mem.pid) || true
          echo "peak system used MB: $(sort -n /tmp/mem.log | tail -1)"
          echo "baseline used MB:    $(head -1 /tmp/mem.log)"
          du -sm $HF_HOME || true
          du -sm ~/.cache/pip || true
          du -sm $(python -c "import site;print(site.getsitepackages()[0])") || true
          df -BM / | tail -1
          python - <<'PY'
          import json
          d = json.load(open("spike/generated/cold.json"))
          d["peak_system_used_mb"] = int(open("/tmp/mem.log").read().split()[0])
          json.dump(d, open("spike/generated/cold.json","w"), indent=2)
          PY

      - name: commit it back
        run: |
          t0=$(date +%s.%N)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f spike/generated
          git commit -m "spike: generation rolled by run ${{ github.run_id }}" || echo "nothing to commit"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
          t1=$(date +%s.%N)
          echo "commit_push_s $(echo "$t1 - $t0" | bc)"

      - name: save the caches for the warm job
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_KEY }}
          path: |
            /home/runner/.cache/pip
            /home/runner/hfcache

      - uses: actions/upload-artifact@v4
        with:
          name: cold
          path: spike/generated

  # ---------------------------------------------------------------- warm: caches restored
  warm:
    runs-on: ubuntu-latest
    needs: cold
    steps:
      - run: |
          df -BM / | tail -1
          ( while true; do free -m | awk '/^Mem:/{print $3}'; sleep 1; done ) > /tmp/mem.log &
          echo $! > /tmp/mem.pid
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: restore caches
        id: restore
        uses: actions/cache/restore@v4
        with:
          key: ${{ env.CACHE_KEY }}
          path: |
            /home/runner/.cache/pip
            /home/runner/hfcache
      - name: pip install from the pip cache
        run: |
          echo "cache hit: ${{ steps.restore.outputs.cache-hit }}"
          t0=$(date +%s.%N)
          python -m pip install --disable-pip-version-check -q \
            --index-url https://download.pytorch.org/whl/cpu torch
          t1=$(date +%s.%N)
          python -m pip install --disable-pip-version-check -q \
            huggingface_hub safetensors tokenizers
          t2=$(date +%s.%N)
          echo "torch wheel   $(echo "$t1 - $t0" | bc) s"
          echo "other wheels  $(echo "$t2 - $t1" | bc) s"
      - name: roll a generation
        run: |
          mkdir -p spike/generated
          SPIKE_THREADS=1 SPIKE_LABEL=warm HF_HUB_OFFLINE=0 python spike/roll_spike.py \
            --agents 8 --lines 24 --passes 1 \
            --out warm.json --lines-out warm-lines.txt
      - name: what it cost
        run: |
          kill $(cat /tmp/mem.pid) || true
          echo "peak system used MB: $(sort -n /tmp/mem.log | tail -1)"
          du -sm $HF_HOME || true
          df -BM / | tail -1
      - uses: actions/download-artifact@v4
        with:
          name: cold
          path: cold
      - name: diff against the cold job
        run: |
          python - <<'PY'
          import json
          a = json.load(open("cold/cold.json"))["digest"]
          b = json.load(open("warm.json"))["digest"]
          print("cold", a)
          print("warm", b)
          print("IDENTICAL ACROSS RUNNERS:", a == b)
          PY
          diff cold/lines.txt warm-lines.txt && echo "byte identical" || echo "DIFFERS"
      - uses: actions/upload-artifact@v4
        with:
          name: warm
          path: |
            warm.json
            warm-lines.txt

  # ------------------------------------------------- fresh: a third runner, 1 thread again
  fresh:
    runs-on: ubuntu-latest
    needs: cold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check -q \
            --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check -q \
            huggingface_hub safetensors tokenizers
      - run: |
          SPIKE_THREADS=1 SPIKE_LABEL=fresh python spike/roll_spike.py \
            --agents 8 --lines 24 --passes 1 --out fresh.json --lines-out fresh-lines.txt
      - uses: actions/download-artifact@v4
        with:
          name: cold
          path: cold
      - name: diff against the cold job
        run: |
          python - <<'PY'
          import json
          a = json.load(open("cold/cold.json"))
          b = json.load(open("fresh.json"))
          print("cold", a["digest"], a["env"].get("cpu"))
          print("fresh", b["digest"], b["env"].get("cpu"))
          print("IDENTICAL ACROSS RUNNERS:", a["digest"] == b["digest"])
          PY
          diff cold/lines.txt fresh-lines.txt && echo "byte identical" || echo "DIFFERS"
      - uses: actions/upload-artifact@v4
        with:
          name: fresh
          path: |
            fresh.json
            fresh-lines.txt

  # -------------------------------------- threads4: is pinning to one thread what costs us
  threads4:
    runs-on: ubuntu-latest
    needs: cold
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check -q \
            --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --disable-pip-version-check -q \
            huggingface_hub safetensors tokenizers
      - run: |
          SPIKE_THREADS=4 SPIKE_LABEL=threads4 python spike/roll_spike.py \
            --agents 8 --lines 24 --passes 2 --out t4.json --lines-out t4-lines.txt
      - uses: actions/download-artifact@v4
        with:
          name: cold
          path: cold
      - name: does the thread count change the text
        run: |
          python - <<'PY'
          import json
          a = json.load(open("cold/cold.json"))
          b = json.load(open("t4.json"))
          print("1 thread ", a["digest"], round(a["times"]["generate_0"],1), "s")
          print("4 threads", b["digest"], round(b["times"]["generate_0"],1), "s")
          print("SAME TEXT AT 4 THREADS:", a["digest"] == b["digest"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: threads4
          path: |
            t4.json
            t4-lines.txt
